{% extends "base.html" %}
{% block content %}
<h3>Available Tasks</h3>
<form class="row g-2 mb-3" action="{{ url_for('search') }}">
  <div class="col-md-4"><input class="form-control" name="q" placeholder="Search"></div>
  <div class="col-md-2"><input class="form-control" name="minb" placeholder="Min"></div>
  <div class="col-md-2"><input class="form-control" name="maxb" placeholder="Max"></div>
  <div class="col-md-2"><input class="form-control" name="skill" placeholder="Skill"></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div>
</form>
<div class="row">
  {% for t in tasks %}
    <div class="col-md-6">
      <div class="card mb-3 p-3 hover-card">
        <div class="d-flex justify-content-between">
          <h5>{{ t['title'] }}</h5>
          <div class="fw-bold">₹{{ t['budget'] }}</div>
        </div>
        <p>{{ t['description'] }}</p>
        <p class="small text-muted">By: <a href="{{ url_for('profile', user_id=t['user_id']) }}">{{ t['poster_name'] or 'Unknown' }}</a></p>
        <a class="btn btn-sm btn-primary" href="{{ url_for('task_detail', task_id=t['id']) }}">View</a>
        <a class="btn btn-sm btn-success" href="{{ url_for('hire', task_id=t['id']) }}">Hire</a>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
