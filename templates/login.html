{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">Login</h3>
      <form method="post">
        <div class="mb-3"><label>Email</label><input class="form-control" name="email" required></div>
        <div class="mb-3"><label>Password</label><input class="form-control" type="password" name="password" required></div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <div class="text-center mt-3 small">Don't have an account? <a href="{{ url_for('register') }}">Register</a></div>
    </div>
  </div>
</div>
{% endblock %}
